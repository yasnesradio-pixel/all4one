<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALL 4 ONE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#0b0f1a}</style>
</head>
<body>
<div id="all4one-widget"></div>
<script>
(function () {
  // ---- SETTINGS ----
  // Feeds are tried in this order: the first one that loads is used.
  var FEEDS = [
    "feed.xml",       // copy of the Podcloud feed, refreshed daily by GitHub (covers, tracklists)
    "podcast.xml"     // backup (archive.org data)
  ];
  var SHOW_NAME = "ALL 4 ONE";
  var SHOW_SOURCE = true;    // true = small line under the list showing which feed was loaded (set to false when tested)
  var ACCENT = "#F28C28";    // brand orange (buttons, current episode)
  var MAX_EPISODES = 3;      // episodes listed (0 = all of them, with search and "Show more")
  var COVER_EFFECT = "fade";  // when the cover changes: "fade", "slide" or "none"
  var PAGE = MAX_EPISODES > 0 ? MAX_EPISODES : 25;
  // ------------------

  var host = document.getElementById("all4one-widget");
  var root = host.attachShadow({ mode: "open" });   // isolates the widget from your site's CSS
  var ACCENT_H = "#ff9d45";   // hover
  var HEAD = "'Oswald','Arial Narrow',sans-serif";
  var C = { bg: "#0b0f1a", card: "#121829", text: "#f3f4f7", muted: "#9aa3b8", line: "#242c44" };

  root.innerHTML =
    '<style>' +
    ':host{display:block}' +
    '*{box-sizing:border-box}' +
    '.w{background:' + C.bg + ';color:' + C.text + ';font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:4px}' +
    '.player{display:flex;gap:18px;flex-wrap:wrap;background:' + C.card + ';border:1px solid ' + C.line + ';border-radius:10px;padding:18px}' +
    '.cover{width:150px;height:150px;border-radius:0;object-fit:cover;background:' + C.line + ';flex:none;transition:opacity .3s ease,transform .3s ease}' +
    '.cover.out{opacity:0}' +
    '.cover.slide.out{transform:translateX(-28px)}' +
    '.cover.pre{transition:none;opacity:0}' +
    '.cover.slide.pre{transform:translateX(28px)}' +
    '.show{font-family:' + HEAD + ';font-weight:600;color:' + ACCENT + ';font-size:13px;text-transform:uppercase;letter-spacing:2px}' +
    '.title{font-family:' + HEAD + ';font-size:21px;font-weight:600;line-height:1.25;margin:0}' +
    '.bar{display:flex;align-items:center;gap:10px}' +
    '.bar span{color:' + C.muted + ';font-size:12px;min-width:42px;font-variant-numeric:tabular-nums}' +
    'input[type=range]{flex:1;accent-color:' + ACCENT + ';height:24px}' +
    '.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}' +
    'button,select,.dl{font-family:' + HEAD + ';font-weight:600;letter-spacing:1px;text-transform:uppercase;font-size:14px;line-height:1.2;color:' + ACCENT + ';background:transparent;border:2px solid ' + ACCENT + ';border-radius:4px;padding:8px 16px;cursor:pointer;text-decoration:none;transition:background .2s ease,color .2s ease,border-color .2s ease}' +
    'button:hover,.dl:hover{background:' + ACCENT + ';color:' + C.bg + '}' +
    'select option{background:' + C.bg + ';color:' + C.text + '}' +
    '#play{background:' + ACCENT + ';color:' + C.bg + ';min-width:120px}' +
    '#play:hover{background:' + ACCENT_H + ';border-color:' + ACCENT_H + '}' +
    '.sp{flex:1}' +
    '#search{width:100%;margin:18px 0 8px;padding:11px 16px;border:1px solid ' + C.line + ';border-radius:4px;background:' + C.card + ';color:' + C.text + ';font:inherit}' +
    'ul{list-style:none;margin:0;padding:0}' +
    'li{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid ' + C.line + ';cursor:pointer;border-radius:8px}' +
    'li:hover{background:' + C.card + '}' +
    'li.on .t{color:' + ACCENT + ';font-weight:700}' +
    '.tl{flex-basis:100%;white-space:pre-wrap;color:' + C.muted + ';font-size:13px;line-height:1.5;padding:8px 0 6px 118px;max-height:340px;overflow:auto;cursor:text;animation:tlin .3s ease}' +
    '@media(max-width:560px){.tl{padding-left:0}}' +
    '@keyframes tlin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}' +
    '.th{width:48px;height:48px;object-fit:cover;border-radius:0;flex:none;background:' + C.line + '}' +
    '.n{font-family:' + HEAD + ';font-weight:600;color:' + ACCENT + ';min-width:46px}' +
    '.t{flex:1}' +
    '.arw{padding:6px 9px;line-height:0}' +
    '.arw svg{transition:transform .2s ease}' +
    'li.open .arw svg{transform:rotate(180deg)}' +
    '.d{color:' + C.muted + ';font-size:12px;white-space:nowrap}' +
    '#more{display:block;margin:16px auto}' +
    '.msg{color:' + C.muted + ';padding:16px 0}' +
    '</style>' +
    '<div class="w">' +
    '<div class="player">' +
    '<img class="cover" id="cover" alt="">' +
    '<div class="main">' +
    '<div class="show" id="show">ALL 4 ONE</div>' +
    '<p class="title" id="title">Loading…</p>' +
    '<div class="bar"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="dur">0:00</span></div>' +
    '<div class="ctl">' +
    '<button id="back" title="Back 15 seconds">↺ 15</button>' +
    '<button id="play" title="Play / Pause">▶ Play</button>' +
    '<button id="fwd" title="Forward 30 seconds">30 ↻</button>' +
    '<select id="speed" title="Speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>' +
    '<span class="sp"></span>' +
    '<a class="dl" id="dl" href="#" target="_blank" rel="noopener" download>⬇ Download</a>' +
    '</div></div></div>' +
    '<input id="search" type="search" placeholder="Search by number or title…">' +
    '<ul id="list"></ul><p class="msg" id="msg">Loading episodes…</p>' +
    '<button id="more" style="display:none">Show more</button>' +
    '<p class="msg" id="src" style="font-size:12px;text-align:center"></p>' +
    '</div>';

  var $ = function (id) { return root.getElementById(id); };
  var audio = new Audio();
  audio.preload = "none";
  var eps = [], view = [], shown = 0, current = -1, opened = {};
  if (MAX_EPISODES > 0) $("search").style.display = "none";
  if (COVER_EFFECT === "slide") $("cover").classList.add("slide");

  function fmt(s) {
    if (!isFinite(s)) return "0:00";
    s = Math.floor(s);
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return (h ? h + ":" + (m < 10 ? "0" : "") : "") + m + ":" + (x < 10 ? "0" : "") + x;
  }
  function tag(node, name) {
    var e = node.getElementsByTagName(name)[0];
    return e ? e.textContent : "";
  }

  var coverTimer = 0;
  function setCover(src) {
    var img = $("cover");
    clearTimeout(coverTimer);
    var cur = img.getAttribute("src");
    if (!src || cur === src) return;
    if (!cur || COVER_EFFECT === "none") { img.src = src; return; }
    img.classList.remove("pre");
    img.classList.add("out");                       // old cover fades / slides out
    coverTimer = setTimeout(function () {
      img.classList.remove("out");
      img.classList.add("pre");                     // new cover waits, invisible
      img.onload = img.onerror = function () {
        img.onload = img.onerror = null;
        void img.offsetWidth;
        img.classList.remove("pre");                // new cover fades / slides in
      };
      img.src = src;
    }, 300);
  }

  function select(i, autoplay) {
    var ep = eps[i];
    if (!ep) return;
    if (i === current && audio.src) { if (audio.paused) audio.play(); else audio.pause(); return; }
    current = i;
    audio.src = ep.url;
    audio.playbackRate = parseFloat($("speed").value);
    $("title").textContent = ep.title;
    setCover(ep.img || defaultCover);
    $("dl").href = ep.url;
    $("dl").style.display = "";
    $("show").style.display = "";
    $("show").textContent = SHOW_NAME;
    try {
      var pos = parseFloat(localStorage.getItem("a4o:" + ep.url));
      if (pos > 5) audio.addEventListener("loadedmetadata", function f() {
        audio.currentTime = pos; audio.removeEventListener("loadedmetadata", f);
      });
    } catch (e) {}
    if (autoplay) audio.play();
    mark();
  }

  function clean(html, title) {
    var s = (html || "").replace(/<br\s*\/?>/gi, "\n").replace(/<\/(p|div|li|h\d)>/gi, "\n");
    s = new DOMParser().parseFromString(s, "text/html").body.textContent || "";
    s = s.replace(/\n{3,}/g, "\n\n").trim();
    return s === title.trim() ? "" : s;
  }

  function mark() {
    var items = $("list").children;
    for (var k = 0; k < items.length; k++) {
      var idx = +items[k].getAttribute("data-i");
      var isOpen = !!opened[idx] && !!(eps[idx] && eps[idx].desc);
      items[k].className = (idx === current ? "on" : "") + (isOpen ? " open" : "");
      var old = items[k].querySelector(".tl");
      if (!isOpen && old) old.remove();
      if (isOpen && !old) {
        var tl = document.createElement("div");
        tl.className = "tl";
        tl.textContent = eps[idx].desc;
        tl.onclick = function (e) { e.stopPropagation(); };
        items[k].appendChild(tl);
      }
    }
  }

  function render(reset) {
    var list = $("list");
    if (reset) { list.innerHTML = ""; shown = 0; }
    var end = Math.min(shown + PAGE, view.length);
    for (; shown < end; shown++) {
      var ep = view[shown], li = document.createElement("li");
      var idx = eps.indexOf(ep);
      li.setAttribute("data-i", idx);
      var n = document.createElement("span"); n.className = "n"; n.textContent = ep.num ? "#" + ep.num : "";
      var t = document.createElement("span"); t.className = "t"; t.textContent = ep.title;
      var d = document.createElement("span"); d.className = "d"; d.textContent = ep.date;
      var th = document.createElement("img");
      th.className = "th"; th.alt = ""; th.loading = "lazy";
      th.src = ep.img || defaultCover;
      li.appendChild(th); li.appendChild(n); li.appendChild(t); li.appendChild(d);
      if (ep.desc) {
        var a = document.createElement("button");
        a.className = "arw";
        a.title = "Show / hide the playlist";
        a.setAttribute("aria-label", "Show or hide the playlist");
        a.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 4.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
        a.onclick = (function (i) { return function (e) { e.stopPropagation(); opened[i] = !opened[i]; mark(); }; })(idx);
        li.appendChild(a);
      }
      li.onclick = (function (i) { return function () { if (i !== current) opened[i] = true; select(i, true); }; })(idx);
      list.appendChild(li);
    }
    $("more").style.display = shown < view.length ? "" : "none";
    $("msg").textContent = view.length ? "" : "No episode found.";
    mark();
  }

  $("search").oninput = function () {
    var q = this.value.trim().toLowerCase().replace("#", "");
    view = eps.filter(function (e) {
      return !q || e.title.toLowerCase().indexOf(q) > -1 || String(e.num) === q;
    });
    render(true);
  };
  $("more").onclick = function () { render(false); };
  $("play").onclick = function () {
    if (current < 0 && eps.length) select(0, true);
    else if (audio.paused) audio.play(); else audio.pause();
  };
  $("back").onclick = function () { audio.currentTime = Math.max(0, audio.currentTime - 15); };
  $("fwd").onclick = function () { audio.currentTime = Math.min(audio.duration || 1e9, audio.currentTime + 30); };
  $("speed").onchange = function () { audio.playbackRate = parseFloat(this.value); };
  $("seek").oninput = function () {
    if (audio.duration) audio.currentTime = audio.duration * this.value / 1000;
  };

  audio.onplay = function () { $("play").textContent = "❚❚ Pause"; };
  audio.onpause = function () { $("play").textContent = "▶ Play"; };
  audio.onloadedmetadata = function () { $("dur").textContent = fmt(audio.duration); };
  audio.ontimeupdate = function () {
    $("cur").textContent = fmt(audio.currentTime);
    if (audio.duration) $("seek").value = audio.currentTime / audio.duration * 1000;
    try {
      if (current >= 0 && Math.floor(audio.currentTime) % 5 === 0)
        localStorage.setItem("a4o:" + eps[current].url, audio.currentTime);
    } catch (e) {}
  };
  audio.onended = function () {
    var limit = MAX_EPISODES > 0 ? Math.min(MAX_EPISODES, eps.length) : eps.length;
    if (current + 1 < limit) select(current + 1, true);
  };

  var defaultCover = "";

  function parse(txt) {
    var xml = new DOMParser().parseFromString(txt, "application/xml");
    var img = xml.getElementsByTagName("itunes:image")[0];   // first one = the show's cover
    var out = [];
    var items = xml.getElementsByTagName("item");
    for (var i = 0; i < items.length; i++) {
      var enc = items[i].getElementsByTagName("enclosure")[0];
      if (!enc) continue;
      var title = tag(items[i], "title");
      var m = title.match(/ALL\s*4\s*ONE\s*#?\s*(\d+)/i);   // real number is in the title
      var im = items[i].getElementsByTagName("itunes:image")[0];
      var dt = new Date(tag(items[i], "pubDate"));
      out.push({
        title: title,
        desc: clean(tag(items[i], "description"), title),
        url: enc.getAttribute("url"),
        img: im ? im.getAttribute("href") : "",
        num: m ? parseInt(m[1], 10) : (parseInt(tag(items[i], "itunes:episode"), 10) || 0),
        date: isNaN(dt) ? "" : dt.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" })
      });
    }
    return { eps: out, cover: img ? img.getAttribute("href") : "" };
  }

  function load(n, errs) {
    errs = errs || [];
    if (n >= FEEDS.length) { $("msg").textContent = "Could not load the episodes. " + errs.join(" | "); return; }
    fetch(FEEDS[n])
      .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.text(); })
      .then(function (txt) {
        var res = parse(txt);
        if (!res.eps.length) throw new Error("empty feed");
        eps = res.eps;
        defaultCover = res.cover || res.eps[0].img || "";
        $("show").style.display = "none";
        $("title").textContent = SHOW_NAME;
        $("dl").style.display = "none";
        $("cover").src = defaultCover;
        if (SHOW_SOURCE) $("src").textContent = "Source: " + (n === 0 ? "Podcloud copy" : "backup feed") + " \u2022 " + eps.length + " episodes";
        view = MAX_EPISODES > 0 ? eps.slice(0, MAX_EPISODES) : eps.slice();
        opened = { 0: true };
        render(true);
      })
      .catch(function (e) {
        errs.push((n === 0 ? "Podcloud" : "backup") + ": " + (e && e.message ? e.message : e));
        load(n + 1, errs);
      });
  }
  load(0, []);
})();
</script>

</body>
</html>
