name: Update feed

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the Podcloud feed
        run: |
          curl -fsSL --retry 3 -A "Mozilla/5.0 (feed-sync)" https://all4one.lepodcast.fr/rss -o new.xml
          grep -q "<rss" new.xml
          mv new.xml feed.xml

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add feed.xml
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Update feed"
          git push

      - name: Trigger the Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "/repos/${{ github.repository }}/pages/builds" || true
