name: Update podcast feed

on:
  schedule:
    - cron: "17 */6 * * *"   # toutes les 6 heures
  workflow_dispatch:          # permet aussi de le lancer à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feed
        run: python build_feed.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet podcast.xml; then
            git config user.name "feed-bot"
            git config user.email "feed-bot@users.noreply.github.com"
            git add podcast.xml
            git commit -m "Add new episodes"
            git push
          fi
