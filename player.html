<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALL 4 ONE</title>
<style>body{margin:0}</style>
</head>
<body>
<div id="all4one-widget"></div>
<script src="widget.js?v=2"></script>
<script>
function send(){
  parent.postMessage({a4oHeight: document.body.getBoundingClientRect().height}, "*");
}
new ResizeObserver(send).observe(document.body);
window.addEventListener("load", send);
</script>
</body>
</html>
